spring.datasource.url=jdbc:h2:mem:menudb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# springdoc emits 3.1 by default; EMB stores every schema as Swagger 2.0 or OpenAPI 3.0,
# and that is the version EvoMaster's parser is happiest with.
springdoc.api-docs.version=openapi_3_0

# Deliberately high: every multipart rejection should come from a visible branch in
# FileValidationService, not from the container refusing the request with a generic error.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Spring Boot defaults this to 0, which spools every file part to the container temp directory
# before the application sees a byte of it - including the ones about to be refused. Parts up to
# this size stay in memory instead. Now that the application itself writes nothing to disk, this
# is the only thing that still could, so it is worth keeping.
spring.servlet.multipart.file-size-threshold=1MB

# Uploads are held as rows in the in-memory database rather than as files, so they live exactly
# as long as the process: a restart is a clean slate and there is never anything left on disk to
# sweep up. There is no storage path to configure. See FileStorageService.

# How many pictures one dish may keep. Bounding only the bytes would leave a dish free to collect
# picture rows forever, which every GET /Foods then carries. See FoodPictureService.trim.
menu.pictures.max-per-food=25

# The store is bounded. A client that has learned to send real image bytes gets every upload
# accepted, and those bytes now sit in the heap, so the ceiling matters more than it did when
# they went to disk. Past either limit the oldest rows go; see FileStorageService for why it
# evicts rather than refusing.
menu.pictures.max-files=200
menu.pictures.max-bytes=33554432
